<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f5f1"><title>Content Space — моя студия</title><style>
:root{--bg:#f8f5f1;--card:#fff;--wine:#70273e;--wine2:#92516a;--ink:#292329;--muted:#81767a;--line:#e8dfe1;--soft:#f1e6e9;--green:#357c5e;--red:#b44f5c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}.shell{max-width:1100px;margin:auto;display:grid;grid-template-columns:218px minmax(0,1fr);min-height:100vh}.sidebar{background:#fff;border-right:1px solid var(--line);padding:26px 14px;position:sticky;top:0;height:100vh}.brand{padding:6px 12px 24px;color:var(--wine);font-size:20px;font-weight:800;letter-spacing:-.5px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px;font-weight:600}.nav{display:flex;flex-direction:column;gap:4px}.nav button{width:100%;text-align:left;border:0;border-radius:12px;padding:12px 13px;background:transparent;color:#544b4f}.nav button.active{background:var(--soft);color:var(--wine);font-weight:700}.main{padding:28px 30px 110px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--wine2);font-weight:800}h1{font-size:30px;line-height:1.15;margin:6px 0}h2{font-size:19px;margin:0 0 14px}h3{font-size:15px;margin:0 0 9px}.sub{color:var(--muted);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.stack{display:grid;gap:14px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.wrap{flex-wrap:wrap}.btn{background:var(--wine);color:#fff;border:1px solid var(--wine);border-radius:11px;padding:10px 14px;font-weight:650}.btn.light{background:var(--soft);color:var(--wine);border-color:var(--soft)}.btn.ghost{background:#fff;color:var(--wine);border-color:var(--line)}.btn.small{padding:6px 10px;font-size:12px}.pill{font-size:11px;border-radius:30px;background:var(--soft);color:var(--wine);padding:4px 9px;white-space:nowrap}.metric{font-size:28px;font-weight:800;color:var(--wine);line-height:1.25}.field{display:grid;gap:5px;margin-bottom:12px}.field label{font-size:12px;color:var(--muted);font-weight:650}input,select,textarea{width:100%;border:1px solid #ddd2d6;border-radius:11px;background:#fff;color:var(--ink);padding:11px 12px;outline-color:var(--wine2)}textarea{resize:vertical;min-height:92px}.task{display:flex;align-items:flex-start;gap:9px;padding:10px 0;border-bottom:1px solid #f0e9eb}.task:last-child{border-bottom:0}.task input[type=checkbox],.check input{width:18px;height:18px;accent-color:var(--wine);margin-top:2px;flex-shrink:0}.task .txt{flex:1;min-width:0;overflow-wrap:anywhere}.done{text-decoration:line-through;color:#9d9699}.quad{min-height:150px;border-radius:15px;padding:14px}.q1{background:#f7e9eb}.q2{background:#f1ebf5}.q3{background:#fff1df}.q4{background:#f0efee}.quad h3{font-size:14px;margin-bottom:3px}.tiny{font-size:11px;color:var(--muted)}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}.tabs button{background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:10px;color:var(--ink)}.tabs button.on{background:var(--wine);color:white;border-color:var(--wine)}.kanban{display:grid;grid-template-columns:repeat(5,minmax(160px,1fr));gap:10px;overflow:auto;padding-bottom:6px}.lane{background:#f3edf0;border-radius:14px;padding:10px;min-height:200px}.item{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;margin-top:9px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{border:1px solid var(--line);border-radius:10px;min-height:70px;padding:6px;background:white;text-align:left;overflow:hidden}.day.selected{border:2px solid var(--wine);background:var(--soft)}.day .dot{width:6px;height:6px;border-radius:50%;background:var(--wine);display:inline-block;margin-right:2px}.day.muted{background:transparent;border-color:transparent}.dayhead{text-align:center;font-size:11px;color:var(--muted);padding:5px}.progress{height:9px;background:#e9dde1;border-radius:99px;overflow:hidden}.progress div{height:100%;background:var(--wine);border-radius:99px}.chip{border-radius:8px;padding:5px 8px;background:#f5f0f1;font-size:11px}.modalwrap{position:fixed;inset:0;background:#23151bc0;display:grid;place-items:center;z-index:30;padding:14px}.modal{background:white;border-radius:20px;padding:22px;width:min(560px,100%);max-height:90vh;overflow:auto}.modal h2{margin-bottom:18px}.close{background:transparent;border:0;font-size:25px;color:var(--muted)}.empty{color:var(--muted);font-size:13px;padding:12px 0}.mobilebar{display:none}.moneyplus{color:var(--green)}.moneyminus{color:var(--red)}.link{color:var(--wine);word-break:break-all}.notice{background:#f5edf0;border-radius:12px;padding:12px;font-size:12px;color:#715461}.filter{max-width:240px}.listline{padding:12px 0;border-bottom:1px solid var(--line)}.listline:last-child{border:0}.danger{color:#a73c4d}.compact{margin:0}.sectionhead{margin:24px 0 12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.projecttag{font-size:11px;color:var(--wine);font-weight:700}.footerhint{margin-top:30px;color:var(--muted);font-size:11px}@media(max-width:760px){.shell{display:block}.sidebar{display:none}.main{padding:22px 15px 100px}.top{align-items:flex-start}.grid{gap:9px}.card{padding:14px;border-radius:15px}.quad{padding:11px;min-height:145px}.quad h3{font-size:12px}.metric{font-size:23px}h1{font-size:26px}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:10;background:#fff;border-top:1px solid var(--line);padding:7px 4px max(8px,env(safe-area-inset-bottom));justify-content:space-around;gap:2px}.mobilebar button{display:grid;justify-items:center;gap:2px;background:transparent;border:0;color:#887d82;font-size:9px;padding:6px 2px;min-width:0;flex:1}.mobilebar button span{font-size:18px}.mobilebar button.active{color:var(--wine);font-weight:800}.three{grid-template-columns:repeat(2,minmax(0,1fr))}.day{min-height:52px;padding:4px;font-size:11px}.calendar{gap:3px}.filter{max-width:100%}}
</style></head><body><div id="app"></div><script>
(()=>{'use strict';const KEY='content_space_burgundy_v1';const base={tasks:[],content:[],ideas:[],notes:{},knowledge:[],transactions:[],projects:[{id:'blog',name:'Мой блог',platforms:['Instagram','TikTok','YouTube']},{id:'wood',name:'WOODNEXT',platforms:['Instagram','VK','Telegram','MAX']},{id:'voice',name:'VOICE',platforms:['Instagram','TikTok','YouTube Shorts','Threads']}],settings:{voiceGoal:60},version:1};let state;try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}');state={...base,...saved,settings:{...base.settings,...saved.settings}};for(const k of ['tasks','content','ideas','knowledge','transactions','projects'])if(!Array.isArray(state[k]))state[k]=base[k];}catch{state=structuredClone(base)}let page='home',mode='calendar',project='all',month=new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0'),selected=localDate(),financeMonth=month,modal=null,knowledgeSearch='',ideaSearch='';const $=id=>document.getElementById(id),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(Number(n)||0),dateFmt=s=>s?new Date(s+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'}):'',projectName=id=>state.projects.find(p=>p.id===id)?.name||'Другое',save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('Не удалось сохранить данные. Проверьте свободное место браузера.')}},today=()=>localDate();function localDate(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}const button=(text,action,cls='btn')=>`<button class="${cls}" data-action="${action}">${text}</button>`;const options=(arr,chosen)=>arr.map(([v,t])=>`<option value="${esc(v)}" ${v===chosen?'selected':''}>${esc(t)}</option>`).join('');const projectOptions=(withAll=true)=>options([...(withAll?[['all','Все проекты']]:[]),...state.projects.map(p=>[p.id,p.name])],project);const stageNames=['Идея','Сценарий','Съёмка','Монтаж','Опубликовано'];const navigation=[['home','⌂','Сегодня'],['content','▦','Контент'],['ideas','✦','Идеи'],['knowledge','▤','Знания'],['finance','₽','Финансы'],['more','◫','Ещё']];function header(title,subtitle,action=''){return `<div class="top"><div><div class="eyebrow">CONTENT SPACE</div><h1>${title}</h1><div class="sub">${subtitle}</div></div>${action}</div>`}function taskItem(t){return `<div class="task"><input aria-label="Выполнить" type="checkbox" data-checktask="${t.id}" ${t.done?'checked':''}><div class="txt ${t.done?'done':''}">${esc(t.text)}<div class="tiny">${t.date?dateFmt(t.date):'Без даты'}</div></div><button class="btn ghost small" data-edit-task="${t.id}">✎</button></div>`}function home(){let tasks=state.tasks.filter(t=>t.date===today()),done=tasks.filter(t=>t.done).length,groups=[['Важно и срочно','Сделать в первую очередь','q1'],['Важно, не срочно','Запланировать','q2'],['Срочно, не важно','По возможности делегировать','q3'],['Не важно и не срочно','Отложить или убрать','q4']];let pub=state.content.filter(c=>c.date===today());return header('Мой день',new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'}),button('+ Задача','task'))+`<div class="grid three"><div class="card"><div class="sub">Задач выполнено</div><div class="metric">${done} / ${tasks.length}</div></div><div class="card"><div class="sub">Публикаций сегодня</div><div class="metric">${pub.length}</div></div><div class="card"><div class="sub">VOICE · роликов за месяц</div><div class="metric">${voiceDone()} / ${state.settings.voiceGoal}</div></div></div><div class="row sectionhead"><h2 style="margin:0">Матрица Эйзенхауэра</h2><span class="pill">Сегодня</span></div><div class="grid">${groups.map((g,i)=>`<div class="quad ${g[2]}"><h3>${g[0]}</h3><div class="tiny">${g[1]}</div>${tasks.filter(t=>+t.priority===i).map(taskItem).join('')||'<div class="empty">Задач пока нет</div>'}</div>`).join('')}</div><div class="row sectionhead"><h2 style="margin:0">Публикации сегодня</h2>${button('+ Публикация','content','btn small')}</div><div class="card">${pub.map(c=>`<div class="listline"><b>${esc(c.title)}</b> <span class="pill">${esc(projectName(c.project))}</span><div class="tiny">${esc(c.format)} · ${esc(stageNames[c.stage]||'Идея')}</div></div>`).join('')||'<div class="empty">Публикаций на сегодня нет</div>'}</div><div class="row sectionhead"><h2 style="margin:0">Вечерний дневник</h2></div>${journalForm()}`}
function journalForm(){const n=state.notes[today()]||{};return `<div class="card"><div class="field"><label>Что сегодня сделала?</label><textarea id="n_done">${esc(n.done||'')}</textarea></div><div class="field"><label>Чему научилась?</label><textarea id="n_learn">${esc(n.learn||'')}</textarea></div><div class="field"><label>Что не успела?</label><textarea id="n_missed">${esc(n.missed||'')}</textarea></div><div class="field"><label>Планы на завтра</label><textarea id="n_tomorrow">${esc(n.tomorrow||'')}</textarea></div><div class="field"><label>Свободные заметки</label><textarea id="n_free">${esc(n.free||'')}</textarea></div>${button('Сохранить итоги дня','savejournal')}</div>`}
function voiceDone(){return state.content.filter(c=>c.project==='voice'&&c.date?.slice(0,7)===month&&c.stage>=3).length}function contentView(){let items=state.content.filter(c=>project==='all'||c.project===project);const d=new Date(month+'-01T12:00:00'),first=(d.getDay()+6)%7,days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();let cal=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="dayhead">${x}</div>`).join('');for(let i=0;i<first;i++)cal+='<div class="day muted"></div>';for(let i=1;i<=days;i++){const ds=month+'-'+String(i).padStart(2,'0'),count=items.filter(c=>c.date===ds).length;cal+=`<button class="day ${selected===ds?'selected':''}" data-date="${ds}">${i}<div>${count?`<span class="dot"></span><span class="tiny">${count}</span>`:''}</div></button>`}return header('Контент-план','Календарь и этапы производства',button('+ Публикация','content'))+`<div class="row wrap" style="margin-bottom:14px"><select class="filter" id="projectfilter">${projectOptions()}</select><div class="tabs" style="margin:0"><button data-mode="calendar" class="${mode==='calendar'?'on':''}">Календарь</button><button data-mode="board" class="${mode==='board'?'on':''}">Доска</button></div></div>${mode==='calendar'?`<div class="card"><div class="row" style="margin-bottom:12px"><button class="btn ghost small" data-month="-1">←</button><b>${d.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</b><button class="btn ghost small" data-month="1">→</button></div><div class="calendar">${cal}</div></div><div class="sectionhead"><h2>${dateFmt(selected)}</h2></div><div class="stack">${items.filter(c=>c.date===selected).map(contentCard).join('')||'<div class="card empty">На эту дату ничего не запланировано</div>'}</div>`:`<div class="kanban">${stageNames.map((s,i)=>`<div class="lane"><b>${s}</b><div class="tiny">${items.filter(c=>c.stage===i).length} материалов</div>${items.filter(c=>c.stage===i).map(c=>`<div class="item"><b>${esc(c.title)}</b><div class="tiny">${esc(projectName(c.project))}</div><div class="tiny">${dateFmt(c.date)}</div><div class="actions" style="margin-top:8px">${i>0?`<button class="btn ghost small" data-stage="${c.id}|${i-1}">←</button>`:''}${i<4?`<button class="btn light small" data-stage="${c.id}|${i+1}">Далее →</button>`:''}<button class="btn ghost small" data-edit-content="${c.id}">✎</button></div></div>`).join('')}</div>`).join('')}</div>`}${voicePanel()}`}
function contentCard(c){const p=state.projects.find(x=>x.id===c.project),platforms=c.platforms||{};return `<div class="card"><div class="row"><div><div class="projecttag">${esc(projectName(c.project))} · ${esc(c.format)}</div><h3 style="margin:4px 0">${esc(c.title)}</h3><div class="tiny">${esc(stageNames[c.stage]||'Идея')}</div></div><button class="btn ghost small" data-edit-content="${c.id}">Изменить</button></div>${c.description?`<p class="sub">${esc(c.description)}</p>`:''}<div class="tiny" style="margin:10px 0 6px">Опубликовано на площадках:</div><div class="actions">${(p?.platforms||[]).map(pl=>`<label class="chip check"><input type="checkbox" data-platform="${c.id}|${encodeURIComponent(pl)}" ${platforms[pl]?'checked':''}> ${esc(pl)}</label>`).join('')}</div></div>`}function voicePanel(){const count=voiceDone(),goal=state.settings.voiceGoal;return `<div class="card" style="margin-top:16px"><div class="row"><b>VOICE · план на ${new Date(month+'-01').toLocaleDateString('ru-RU',{month:'long'})}</b><span class="pill">${count} / ${goal}</span></div><div class="progress" style="margin:12px 0"><div style="width:${Math.min(100,count/Math.max(1,goal)*100)}%"></div></div><div class="sub">Цель — ${goal} уникальных роликов. Публикации на четырёх площадках отмечаются отдельно.</div></div>`}
function ideas(){let list=state.ideas.filter(i=>(project==='all'||i.project===project)&&[i.title,i.description,i.ref].join(' ').toLowerCase().includes(ideaSearch.toLowerCase()));return header('Банк идей','Записывай быстро, дорабатывай позже',button('+ Идея','idea'))+`<div class="row wrap" style="margin-bottom:14px"><select class="filter" id="projectfilter">${projectOptions()}</select><input style="max-width:320px" id="ideasearch" placeholder="Поиск идей" value="${esc(ideaSearch)}"></div><div class="grid">${list.map(i=>`<div class="card"><div class="row"><span class="projecttag">${esc(projectName(i.project))}</span><span class="pill">${esc(i.format||'Быстрая идея')}</span></div><h3 style="margin-top:12px">${esc(i.title)}</h3><div class="sub">${esc(i.description||'')}</div>${i.ref?`<p><a class="link" href="${esc(safeUrl(i.ref))}" target="_blank" rel="noopener noreferrer">Референс ↗</a></p>`:''}<div class="actions" style="margin-top:12px"><button class="btn light small" data-edit-idea="${i.id}">Дополнить</button><button class="btn ghost small" data-idea-to-content="${i.id}">В контент-план</button></div></div>`).join('')||'<div class="card empty">Пока нет идей — добавь первую</div>'}</div>`}function safeUrl(u){try{const x=new URL(u);return ['http:','https:'].includes(x.protocol)?x.href:'#'}catch{return '#'}}
const seeded=[['Хуки','Первые 2 секунды','Начинай с конфликта, неожиданного факта, конкретного обещания или вопроса, который действительно волнует аудиторию. Проверяй, совпадает ли начало с содержанием ролика.'],['Сценарии','Структура короткого ролика','Хук → контекст → развитие мысли или демонстрация → вывод → один понятный призыв к действию.'],['Форматы','Контент для экспертов','Разбор ошибок, ответы на возражения, личный опыт, кейсы, мифы, реакции на новости, практические инструкции.'],['Форматы','Контент для бизнеса','Обзоры продукта, сравнения, реальные кейсы, закулисье, юмор, вопросы клиентов, демонстрация результата.'],['Поиск идей','Источники идей','Комментарии клиентов, отзывы, частые вопросы, книги, мемы, статьи, новости отрасли и референсы из других ниш.'],['Монтаж','Чек-лист перед публикацией','Проверь первые секунды, понятность без звука, субтитры, ритм, кадрирование, обложку, качество звука и один призыв.'],['Аналитика','Что оценивать в Reels','Смотри не только просмотры, но и удержание, охват, сохранения, репосты, подписки, переходы и заявки — по цели ролика.']];function knowledge(){const all=[...seeded.map((a,i)=>({id:'seed'+i,category:a[0],title:a[1],body:a[2],builtin:true})),...state.knowledge];let list=all.filter(k=>[k.title,k.body,k.category].join(' ').toLowerCase().includes(knowledgeSearch.toLowerCase()));return header('База знаний','Материалы и твои собственные конспекты',button('+ Конспект','knowledge'))+`<div class="notice" style="margin-bottom:14px">Здесь стартовая библиотека. Исходные PDF с 600 формулами заголовков и XLSX с хуками пока не импортированы: чтобы добавить их полностью, понадобится загрузить файлы при следующем обновлении.</div><input id="knowsearch" placeholder="Поиск по базе знаний" value="${esc(knowledgeSearch)}" style="margin-bottom:14px"><div class="grid">${list.map(k=>`<div class="card"><span class="pill">${esc(k.category)}</span><h3 style="margin-top:12px">${esc(k.title)}</h3><p class="sub">${esc(k.body)}</p>${!k.builtin?`<button class="btn ghost small" data-edit-knowledge="${k.id}">Изменить</button>`:''}</div>`).join('')||'<div class="card empty">Ничего не найдено</div>'}</div>`}
function finance(){let tx=state.transactions.filter(t=>t.date?.slice(0,7)===financeMonth),income=tx.filter(t=>t.type==='income'&&t.status!=='expected').reduce((s,t)=>s+ +t.amount,0),expense=tx.filter(t=>t.type==='expense').reduce((s,t)=>s+ +t.amount,0),expected=tx.filter(t=>t.type==='income'&&t.status==='expected').reduce((s,t)=>s+ +t.amount,0),savings=tx.filter(t=>t.type==='saving').reduce((s,t)=>s+ +t.amount,0);let bySource={};tx.filter(t=>t.type==='income'&&t.status!=='expected').forEach(t=>bySource[t.category]=(bySource[t.category]||0)+ +t.amount);return header('Финансы','Доходы, расходы и ожидаемые выплаты',button('+ Операция','transaction'))+`<div class="row wrap" style="margin-bottom:14px"><input type="month" id="financemonth" style="max-width:210px" value="${financeMonth}"><span class="sub">Данные вносятся вручную</span></div><div class="grid"><div class="card"><div class="sub">Получено</div><div class="metric moneyplus">${fmt(income)} ₽</div></div><div class="card"><div class="sub">Потрачено</div><div class="metric moneyminus">${fmt(expense)} ₽</div></div><div class="card"><div class="sub">Разница</div><div class="metric">${fmt(income-expense)} ₽</div></div><div class="card"><div class="sub">Ожидаю / отложено</div><b>${fmt(expected)} ₽ / ${fmt(savings)} ₽</b></div></div><div class="grid" style="margin-top:14px"><div class="card"><h2>Откуда доход</h2>${Object.entries(bySource).sort((a,b)=>b[1]-a[1]).map(([name,v])=>`<div class="row listline"><span>${esc(name)}</span><b>${fmt(v)} ₽</b></div>`).join('')||'<div class="empty">Доходов пока нет</div>'}</div><div class="card"><h2>Операции</h2>${tx.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<div class="row listline"><div><b>${esc(t.category)}</b><div class="tiny">${dateFmt(t.date)} · ${esc(t.note||'')} ${t.status==='expected'?'· ожидается':''}</div></div><div style="text-align:right"><b class="${t.type==='income'?'moneyplus':t.type==='expense'?'moneyminus':''}">${t.type==='income'?'+':t.type==='expense'?'−':'↗'}${fmt(t.amount)} ₽</b><div><button class="btn ghost small" data-edit-transaction="${t.id}">✎</button></div></div></div>`).join('')||'<div class="empty">Пока нет операций</div>'}</div></div><div class="notice" style="margin-top:14px">Перевод на накопительный счёт учитывается отдельно и не считается расходом. «Разница» — доходы минус расходы за месяц, а не фактический остаток на банковской карте.</div>`}
function more(){return header('Ещё','Проекты, аналитика, архив дневника и данные')+`<div class="tabs"><button data-sub="projects">Проекты</button><button data-sub="analytics">Аналитика</button><button data-sub="diary">Дневник</button><button data-sub="settings">Настройки</button></div><div id="subarea">${subView()}</div>`}let sub='projects';function subView(){if(sub==='projects')return `<div class="grid">${state.projects.map(p=>`<div class="card"><h2>${esc(p.name)}</h2><div class="sub">${p.platforms.map(esc).join(' · ')}</div><div class="metric" style="margin-top:12px">${state.content.filter(c=>c.project===p.id).length}</div><div class="tiny">материалов в плане</div><button class="btn ghost small" data-edit-project="${p.id}" style="margin-top:12px">Изменить</button></div>`).join('')}</div><div style="margin-top:14px">${button('+ Новый проект','project')}</div>`;if(sub==='analytics'){let items=state.content.filter(c=>project==='all'||c.project===project);let views=items.reduce((s,c)=>s+(+c.views||0),0),leads=items.reduce((s,c)=>s+(+c.leads||0),0),format={};items.forEach(c=>{let f=c.format||'Другое';format[f]=(format[f]||0)+(+c.views||0)});return `<div class="row" style="margin-bottom:14px"><select class="filter" id="projectfilter">${projectOptions()}</select></div><div class="grid three"><div class="card"><div class="sub">Материалов</div><div class="metric">${items.length}</div></div><div class="card"><div class="sub">Просмотров (внесено)</div><div class="metric">${fmt(views)}</div></div><div class="card"><div class="sub">Заявок (внесено)</div><div class="metric">${fmt(leads)}</div></div></div><div class="card" style="margin-top:14px"><h2>Просмотры по форматам</h2>${Object.entries(format).map(([f,n])=>`<div class="listline row"><span>${esc(f)}</span><b>${fmt(n)}</b></div>`).join('')||'<div class="empty">Добавь статистику в карточках публикаций</div>'}</div><div class="notice" style="margin-top:14px">Автоматическое подключение Instagram пока не реализовано. Для него нужна отдельная серверная интеграция с Meta API.</div>`}if(sub==='diary'){let keys=Object.keys(state.notes).sort().reverse();return `<div class="stack">${keys.map(d=>`<div class="card"><h3>${dateFmt(d)}</h3>${[['Сделала','done'],['Научилась','learn'],['Не успела','missed'],['Планы','tomorrow'],['Заметки','free']].filter(([t,k])=>state.notes[d][k]).map(([t,k])=>`<div style="margin:7px 0"><b>${t}:</b> <span class="sub">${esc(state.notes[d][k])}</span></div>`).join('')}</div>`).join('')||'<div class="card empty">Записей пока нет. Заполни дневник на главной.</div>'}</div>`}return `<div class="card stack"><div class="field"><label>Цель VOICE: уникальных роликов в месяц</label><input id="voicegoal" type="number" min="1" value="${state.settings.voiceGoal}"></div>${button('Сохранить цель','savegoal')}<hr style="border:0;border-top:1px solid var(--line)"><h3>Резервная копия</h3><div class="sub">Данные хранятся в браузере этого устройства. Экспортируй копию регулярно: при очистке данных сайта записи могут исчезнуть.</div><div class="actions">${button('Скачать данные JSON','export','btn light')}<label class="btn ghost" style="cursor:pointer">Импортировать JSON<input id="importfile" type="file" accept="application/json,.json" hidden></label></div></div>`}
function field(label,id,value='',type='text'){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}"></div>`}function selectField(label,id,values,selected){return `<div class="field"><label>${label}</label><select id="${id}">${options(values,selected)}</select></div>`}function textarea(label,id,v=''){return `<div class="field"><label>${label}</label><textarea id="${id}">${esc(v)}</textarea></div>`}function modalForm(type,id){const get=arr=>arr.find(x=>x.id===id)||{},pOpts=state.projects.map(p=>[p.id,p.name]);let title='',html='';if(type==='task'){const x=get(state.tasks);title=id?'Изменить задачу':'Новая задача';html=field('Задача','f_title',x.text)+field('Дата','f_date',x.date||today(),'date')+selectField('Матрица Эйзенхауэра','f_priority',[['0','Важно и срочно'],['1','Важно, не срочно'],['2','Срочно, не важно'],['3','Не важно и не срочно']],String(x.priority??'0'))}if(type==='content'){const x=get(state.content);title=id?'Редактировать публикацию':'Новая публикация';html=field('Название','f_title',x.title)+selectField('Проект','f_project',pOpts,x.project||pOpts[0]?.[0])+selectField('Формат','f_format',[['Reels','Reels'],['Карусель','Карусель'],['Stories','Stories'],['UGC','UGC'],['Пост','Пост'],['Другое','Другое']],x.format||'Reels')+field('Дата публикации','f_date',x.date||today(),'date')+selectField('Этап','f_stage',stageNames.map((n,i)=>[String(i),n]),String(x.stage??0))+textarea('Сценарий / описание','f_description',x.description)+`<div class="grid">${field('Просмотры','f_views',x.views||0,'number')}${field('Охват','f_reach',x.reach||0,'number')}${field('Лайки','f_likes',x.likes||0,'number')}${field('Сохранения','f_saves',x.saves||0,'number')}${field('Репосты','f_shares',x.shares||0,'number')}${field('Комментарии','f_comments',x.comments||0,'number')}${field('Новые подписчики','f_followers',x.followers||0,'number')}${field('Заявки','f_leads',x.leads||0,'number')}</div>`}if(type==='idea'){const x=get(state.ideas);title=id?'Дополнить идею':'Новая идея';html=field('Идея','f_title',x.title)+selectField('Проект','f_project',pOpts,x.project||pOpts[0]?.[0])+selectField('Формат','f_format',[['','Быстрая заметка'],['Reels','Reels'],['Карусель','Карусель'],['Stories','Stories'],['UGC','UGC'],['Другое','Другое']],x.format||'')+textarea('Описание / развитие идеи','f_description',x.description)+field('Референс (URL)','f_ref',x.ref)}if(type==='knowledge'){const x=get(state.knowledge);title='Конспект';html=field('Название','f_title',x.title)+field('Категория','f_category',x.category||'Мои заметки')+textarea('Текст конспекта','f_body',x.body)}if(type==='transaction'){const x=get(state.transactions);title='Финансовая операция';html=selectField('Тип','f_type',[['income','Доход'],['expense','Расход'],['saving','Перевод в накопления']],x.type||'expense')+field('Сумма, ₽','f_amount',x.amount||'','number')+field('Дата','f_date',x.date||today(),'date')+field('Источник / категория','f_category',x.category||'')+selectField('Статус дохода','f_status',[['received','Получено'],['expected','Ожидается']],x.status||'received')+textarea('Комментарий','f_note',x.note||'')+`<div class="notice">Для модельных съёмок можешь указать «Съёмки моделью» и сумму: часы × 1 500 ₽.</div>`}if(type==='project'){const x=get(state.projects);title='Проект';html=field('Название','f_title',x.name)+field('Площадки через запятую','f_platforms',(x.platforms||[]).join(', '))}return `<div class="modalwrap" id="modalwrap"><div class="modal"><div class="row"><h2>${title}</h2><button class="close" data-action="close">×</button></div><form id="modalform" data-type="${type}" data-id="${esc(id||'')}">${html}<div class="actions"><button class="btn" type="submit">Сохранить</button>${id?`<button type="button" class="btn ghost danger" data-delete="${type}|${id}">Удалить</button>`:''}</div></form></div></div>`}
function render(){const body={home,content:contentView,ideas,knowledge,finance,more}[page]();$('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><small>МОЯ СТУДИЯ</small>Content Space</div><nav class="nav">${navigation.map(([id,ic,label])=>`<button data-page="${id}" class="${page===id?'active':''}">${ic} &nbsp; ${label}</button>`).join('')}</nav></aside><main class="main">${body}<div class="footerhint">Данные сохраняются в браузере устройства · Делай резервную копию в разделе «Ещё»</div></main></div><nav class="mobilebar">${navigation.map(([id,ic,label])=>`<button data-page="${id}" class="${page===id?'active':''}"><span>${ic}</span>${label}</button>`).join('')}</nav>${modal?modalForm(modal.type,modal.id):''}`}
function readForm(form){const v=id=>$(id)?.value?.trim()||'',type=form.dataset.type,id=form.dataset.id;let arr=({task:'tasks',content:'content',idea:'ideas',knowledge:'knowledge',transaction:'transactions',project:'projects'})[type],obj=state[arr].find(x=>x.id===id)||{id:uid()};if(type==='task'){obj.text=v('f_title');obj.date=v('f_date');obj.priority=+v('f_priority');obj.done=obj.done||false}if(type==='content'){Object.assign(obj,{title:v('f_title'),project:v('f_project'),format:v('f_format'),date:v('f_date'),stage:+v('f_stage'),description:v('f_description'),platforms:obj.platforms||{}});for(const k of ['views','reach','likes','saves','shares','comments','followers','leads'])obj[k]=Math.max(0,+v('f_'+k)||0)}if(type==='idea')Object.assign(obj,{title:v('f_title'),project:v('f_project'),format:v('f_format'),description:v('f_description'),ref:v('f_ref')});if(type==='knowledge')Object.assign(obj,{title:v('f_title'),category:v('f_category'),body:v('f_body')});if(type==='transaction')Object.assign(obj,{type:v('f_type'),amount:+v('f_amount'),date:v('f_date'),category:v('f_category')||'Другое',status:v('f_status'),note:v('f_note')});if(type==='project')Object.assign(obj,{name:v('f_title'),platforms:v('f_platforms').split(',').map(x=>x.trim()).filter(Boolean)});if(type==='transaction'&&(!Number.isFinite(obj.amount)||obj.amount<=0)){alert('Введите сумму больше нуля');return}if(!((obj.text||obj.title||obj.name||obj.category||'').trim())){alert('Заполните основное поле');return}if(!id)state[arr].push(obj);save();modal=null;render()}
document.addEventListener('submit',e=>{if(e.target.id==='modalform'){e.preventDefault();readForm(e.target)}});document.addEventListener('change',e=>{const el=e.target;if(el.id==='projectfilter'){project=el.value;render()}if(el.id==='financemonth'){financeMonth=el.value;render()}if(el.dataset.checktask){let t=state.tasks.find(x=>x.id===el.dataset.checktask);if(t){t.done=el.checked;save();render()}}if(el.dataset.platform){const [id,p]=el.dataset.platform.split('|'),c=state.content.find(x=>x.id===id);if(c){c.platforms=c.platforms||{};c.platforms[decodeURIComponent(p)]=el.checked;save()}}if(el.id==='importfile'){const f=el.files?.[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(!obj||!Array.isArray(obj.tasks)||!Array.isArray(obj.content)||!Array.isArray(obj.transactions)||!Array.isArray(obj.projects))throw Error('Формат файла не подходит');if(confirm('Заменить текущие данные импортированными?')){state={...base,...obj};save();render()}}catch{alert('Не удалось прочитать резервную копию')}};reader.readAsText(f)}});document.addEventListener('input',e=>{if(e.target.id==='knowsearch'){knowledgeSearch=e.target.value;const pos=e.target.selectionStart;render();$('knowsearch')?.focus();$('knowsearch')?.setSelectionRange(pos,pos)}if(e.target.id==='ideasearch'){ideaSearch=e.target.value;const pos=e.target.selectionStart;render();$('ideasearch')?.focus();$('ideasearch')?.setSelectionRange(pos,pos)}});document.addEventListener('click',e=>{let el=e.target.closest('[data-page],[data-action],[data-edit-task],[data-edit-content],[data-edit-idea],[data-edit-knowledge],[data-edit-transaction],[data-edit-project],[data-idea-to-content],[data-delete],[data-mode],[data-date],[data-month],[data-stage],[data-sub]');if(!el){if(e.target.id==='modalwrap'){modal=null;render()}return}if(el.dataset.page){page=el.dataset.page;render();scrollTo(0,0);return}if(el.dataset.action){const a=el.dataset.action;if(['task','content','idea','knowledge','transaction','project'].includes(a))modal={type:a};if(a==='close')modal=null;if(a==='savejournal'){state.notes[today()]={done:$('n_done').value,learn:$('n_learn').value,missed:$('n_missed').value,tomorrow:$('n_tomorrow').value,free:$('n_free').value};save();alert('Запись сохранена')}if(a==='savegoal'){state.settings.voiceGoal=Math.max(1,+$('voicegoal').value||60);save()}if(a==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='content-space-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}render();return}for(const [k,t] of [['editTask','task'],['editContent','content'],['editIdea','idea'],['editKnowledge','knowledge'],['editTransaction','transaction'],['editProject','project']]){if(el.dataset[k]){modal={type:t,id:el.dataset[k]};render();return}}if(el.dataset.ideaToContent){const x=state.ideas.find(i=>i.id===el.dataset.ideaToContent);if(x){state.content.push({id:uid(),title:x.title,project:x.project,format:x.format||'Reels',description:x.description,date:today(),stage:0,platforms:{}});save();page='content';render()}return}if(el.dataset.delete){const [t,id]=el.dataset.delete.split('|'),arr=({task:'tasks',content:'content',idea:'ideas',knowledge:'knowledge',transaction:'transactions',project:'projects'})[t];if(t==='project'&&state.content.some(c=>c.project===id)){alert('Сначала перенесите публикации в другой проект');return}if(confirm('Удалить запись без возможности отмены?')){state[arr]=state[arr].filter(x=>x.id!==id);save();modal=null;render()}return}if(el.dataset.mode){mode=el.dataset.mode;render();return}if(el.dataset.date){selected=el.dataset.date;render();return}if(el.dataset.month){const d=new Date(month+'-01T12:00:00');d.setMonth(d.getMonth()+ +el.dataset.month);month=localDate(d).slice(0,7);selected=month+'-01';render();return}if(el.dataset.stage){const [id,st]=el.dataset.stage.split('|'),c=state.content.find(x=>x.id===id);if(c){c.stage=+st;save();render()}return}if(el.dataset.sub){sub=el.dataset.sub;render();return}});render();})();
</script></body></html>
