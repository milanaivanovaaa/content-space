<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15161c"><title>Content Space</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#f6f4f3;background:#111218}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:2;background:#15161cf5;border-bottom:1px solid #30313b;padding:17px 18px}header b{font-size:22px;letter-spacing:-.6px}header small{display:block;color:#a8a6b4;margin-top:3px}.wrap{max-width:900px;margin:auto;padding:18px 16px 100px}.tabs{display:flex;gap:8px;overflow:auto;padding:12px 16px;background:#15161c}.tabs button,.chip{white-space:nowrap;background:#272832;border:1px solid #383943;border-radius:13px;color:#ddd;padding:10px 13px}.tabs button.active,.primary{background:#dbb5f6!important;color:#20132b!important;border-color:#dbb5f6!important}.card{background:#1d1e27;border:1px solid #33343f;border-radius:19px;padding:17px;margin-bottom:13px}.muted{color:#a8a6b4;font-size:13px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.pill{border-radius:20px;background:#30313c;padding:6px 10px;font-size:12px;color:#e4d4ed}h2{font-size:23px;margin:8px 0 16px}h3{font-size:16px;margin:0 0 10px}input,textarea,select{background:#12131a;color:#f5f5f7;border:1px solid #444552;border-radius:12px;padding:12px;width:100%;min-width:0}textarea{min-height:86px;resize:vertical}label{display:block;font-size:13px;color:#bcb8c6;margin:10px 0 5px}.btn{border:1px solid #454451;border-radius:12px;background:#30303c;color:#fff;padding:11px 13px}.danger{color:#ff9ca9}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{background:#252632;border-radius:14px;padding:13px}.metric strong{display:block;font-size:27px;margin:4px 0}.item{border-top:1px solid #343540;padding:13px 0}.item:first-of-type{border-top:0}.item strong{display:block;margin-bottom:5px}.check{width:20px;height:20px;accent-color:#d5a6f1}.task{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid #343540}.task span{flex:1}.done{text-decoration:line-through;opacity:.5}.stages{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}.stages button{font-size:12px;padding:7px 9px;border-radius:9px;border:1px solid #41414c;background:#292a34;color:#c5c4cc}.stages button.on{background:#4b365d;border-color:#c99de8;color:white}.tiny{font-size:12px}.empty{text-align:center;color:#a8a6b4;padding:25px 8px}.notice{background:#2a2435;border-radius:14px;padding:12px;font-size:13px;color:#e2c9f5}.navbottom{position:fixed;bottom:0;left:0;right:0;background:#171820;border-top:1px solid #353541;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:3}.navbottom button{border:0;background:none;color:#bdbbc7;font-size:12px}.navbottom button.on{color:#e0b3fa;font-weight:700}@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.navbottom{display:none}} </style></head><body><header><b>✦ Content Space</b><small>Твоя контент-студия • идеи → результат</small></header><div class="tabs" id="tabs"></div><main class="wrap" id="app"></main><div class="navbottom" id="bottom"></div><script>
const KEY='content-space-v1';const today=()=>new Date().toLocaleDateString('en-CA');const initial={project:'Мой блог',posts:[],tasks:[],ideas:[],journals:{},profile:{bio:'Reels-продюсер • UGC Creator',goals:'500 → 1000 подписчиков',highlights:'Обо мне\nУслуги\nКейсы\nОтзывы\nUGC\nЗакулисье'},clients:'WOODNEXT',notes:''};let data;try{data={...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){data=structuredClone(initial)}let tab='Сегодня';const tabs=['Сегодня','Контент','Идеи','Дневник','Профиль'];const stages=['Идея','Сценарий','Снято','Монтаж','Опубликовано'];function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function addPost(){let title=document.querySelector('#pTitle').value.trim(),date=document.querySelector('#pDate').value,format=document.querySelector('#pFormat').value;if(!title)return alert('Напиши тему');data.posts.unshift({id:Date.now(),title,date,format,project:data.project,stage:0});save()}function addTask(){let text=document.querySelector('#taskText').value.trim(),date=document.querySelector('#taskDate').value;if(!text)return;data.tasks.unshift({id:Date.now(),text,date,project:data.project,done:false});save()}function addIdea(){let title=document.querySelector('#ideaText').value.trim();if(!title)return;data.ideas.unshift({id:Date.now(),title,project:data.project});save()}function remove(type,id){if(!confirm('Удалить запись?'))return;data[type]=data[type].filter(x=>x.id!==id);save()}function stage(id,n){let p=data.posts.find(x=>x.id===id);p.stage=n;save()}function taskToggle(id){let t=data.tasks.find(x=>x.id===id);t.done=!t.done;save()}function ideaToPost(id){let i=data.ideas.find(x=>x.id===id);data.posts.unshift({id:Date.now(),title:i.title,date:today(),format:'Reels',project:i.project,stage:0});save();tab='Контент';render()}function field(id,label,val='',type='text'){return `<label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(val)}">`}function projectPicker(){return `<div class="row" style="margin-bottom:15px"><button class="chip ${data.project==='Мой блог'?'primary':''}" onclick="data.project='Мой блог';save()">✦ Мой блог</button><button class="chip ${data.project==='WOODNEXT'?'primary':''}" onclick="data.project='WOODNEXT';save()">⌂ WOODNEXT</button></div>`}function postList(posts){return posts.length?posts.map(p=>`<div class="item"><div class="row between"><strong>${esc(p.title)}</strong><span class="pill">${esc(p.format)}</span></div><div class="muted">${esc(p.date||'Без даты')} · ${esc(p.project)} · ${stages[p.stage]}</div><div class="stages">${stages.map((s,n)=>`<button class="${p.stage===n?'on':''}" onclick="stage(${p.id},${n})">${esc(s)}</button>`).join('')}</div><div style="text-align:right;margin-top:7px"><button class="btn tiny danger" onclick="remove('posts',${p.id})">Удалить</button></div></div>`).join(''):'<div class="empty">Публикаций пока нет — добавь первую ✨</div>'}function taskList(ts){return ts.length?ts.map(t=>`<div class="task"><input class="check" type="checkbox" ${t.done?'checked':''} onchange="taskToggle(${t.id})"><span class="${t.done?'done':''}">${esc(t.text)}<div class="muted">${esc(t.date)} · ${esc(t.project)}</div></span><button class="btn tiny danger" onclick="remove('tasks',${t.id})">×</button></div>`).join(''):'<div class="empty">Задач пока нет</div>'}function render(){document.querySelector('#tabs').innerHTML=tabs.map(t=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';render()">${t}</button>`).join('');document.querySelector('#bottom').innerHTML=tabs.map((t,i)=>`<button class="${tab===t?'on':''}" onclick="tab='${t}';render()">${['◉','▦','✧','✓','♙'][i]}<br>${t}</button>`).join('');let ps=data.posts.filter(p=>p.project===data.project),ts=data.tasks.filter(t=>t.project===data.project),is=data.ideas.filter(i=>i.project===data.project);let html=projectPicker();if(tab==='Сегодня'){let td=today(),todayTasks=ts.filter(t=>t.date===td),upcoming=ps.filter(p=>p.date>=td&&p.stage<4).sort((a,b)=>a.date.localeCompare(b.date));html+=`<h2>Твой рабочий день ✨</h2><div class="grid"><div class="metric"><span class="muted">Всего материалов</span><strong>${ps.length}</strong></div><div class="metric"><span class="muted">Опубликовано</span><strong>${ps.filter(p=>p.stage===4).length}</strong></div><div class="metric"><span class="muted">Задач сегодня</span><strong>${todayTasks.length}</strong></div><div class="metric"><span class="muted">Выполнено</span><strong>${todayTasks.filter(t=>t.done).length}</strong></div></div><div class="card" style="margin-top:14px"><h3>План на сегодня · ${td}</h3>${taskList(todayTasks)}</div><div class="card"><h3>Добавить задачу</h3>${field('taskText','Что нужно сделать?')}${field('taskDate','Дата',td,'date')}<button class="btn primary" style="margin-top:12px" onclick="addTask()">+ Добавить задачу</button></div><div class="card"><h3>Ближайшие публикации</h3>${postList(upcoming.slice(0,3))}</div><div class="notice">Совет: отмечай этапы Reels по мере работы, а вечером записывай результаты в «Дневник».</div>`}if(tab==='Контент'){html+=`<h2>Контент-план</h2><div class="card"><h3>Новая публикация</h3>${field('pTitle','Тема или хук')}${field('pDate','Дата публикации',today(),'date')}<label>Формат</label><select id="pFormat"><option>Reels</option><option>Карусель</option><option>Stories</option><option>Пост</option></select><button class="btn primary" style="margin-top:12px" onclick="addPost()">+ Добавить в план</button></div><div class="card"><h3>Все публикации · ${ps.length}</h3>${postList([...ps].sort((a,b)=>(a.date||'').localeCompare(b.date||'')))}</div>`}if(tab==='Идеи'){html+=`<h2>Банк идей</h2><div class="card"><h3>Записать идею</h3><textarea id="ideaText" placeholder="Хук, тема, сюжет, инсайт из подкаста..."></textarea><button class="btn primary" style="margin-top:12px" onclick="addIdea()">+ Сохранить идею</button></div><div class="card"><h3>Идеи · ${is.length}</h3>${is.length?is.map(i=>`<div class="item"><strong>${esc(i.title)}</strong><div class="row"><button class="btn tiny" onclick="ideaToPost(${i.id})">В контент-план →</button><button class="btn tiny danger" onclick="remove('ideas',${i.id})">Удалить</button></div></div>`).join(''):'<div class="empty">Здесь будут твои лучшие идеи</div>'}</div><div class="notice">Источники: подкасты и таймкоды, ассоциации, неожиданные персонажи, вопросы клиентов, тренды и книги.</div>`}if(tab==='Дневник'){let d=today(),j=data.journals[d]||{};html+=`<h2>Дневник продуктивности</h2><div class="card"><label>Дата</label><input type="date" id="journalDate" value="${d}" onchange="journalDateChange(this.value)"><label>Что полезного сделала?</label><textarea id="journalDone" placeholder="Сняла 2 Reels, нашла 5 идей...">${esc(j.done||'')}</textarea><label>Планы на завтра</label><textarea id="journalTomorrow" placeholder="Смонтировать, написать сценарий...">${esc(j.tomorrow||'')}</textarea><label>Итоги и выводы</label><textarea id="journalNotes" placeholder="Что сработало, что улучшить...">${esc(j.notes||'')}</textarea><button class="btn primary" style="margin-top:12px" onclick="journalSave()">Сохранить день</button><button class="btn" style="margin:12px 0 0 8px" onclick="tomorrowTasks()">Перенести планы в задачи</button></div><div class="card"><h3>История дней</h3>${Object.entries(data.journals).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,14).map(([date,j])=>`<div class="item"><strong>${esc(date)}</strong><div class="muted">${esc((j.done||'').slice(0,170))}</div></div>`).join('')||'<div class="empty">Первая запись ещё впереди</div>'}</div>`}if(tab==='Профиль'){html+=`<h2>Моя студия</h2><div class="card"><h3>Оформление профиля</h3><label>Позиционирование / шапка</label><textarea id="bio">${esc(data.profile.bio)}</textarea><label>Цель блога</label><textarea id="goals">${esc(data.profile.goals)}</textarea><label>Актуальные Highlights</label><textarea id="highlights">${esc(data.profile.highlights)}</textarea><button class="btn primary" style="margin-top:12px" onclick="profileSave()">Сохранить</button></div><div class="card"><h3>Клиентские заметки</h3><textarea id="notes" placeholder="ЦА, офферы, контент-рубрики, важные договорённости...">${esc(data.notes)}</textarea><button class="btn" style="margin-top:12px" onclick="data.notes=document.querySelector('#notes').value;save()">Сохранить заметки</button></div><div class="card"><h3>Резервная копия</h3><p class="muted">Данные хранятся только в этом браузере. Сохраняй копию, чтобы не потерять контент-план.</p><div class="row"><button class="btn" onclick="exportData()">Скачать копию</button><label class="btn" style="margin:0">Восстановить <input type="file" accept="application/json" style="display:none" onchange="importData(event)"></label></div></div>`}document.querySelector('#app').innerHTML=html}
let journalDate=today();function journalDateChange(d){journalDate=d;let j=data.journals[d]||{};document.querySelector('#journalDone').value=j.done||'';document.querySelector('#journalTomorrow').value=j.tomorrow||'';document.querySelector('#journalNotes').value=j.notes||''}function journalSave(){let d=document.querySelector('#journalDate').value;data.journals[d]={done:document.querySelector('#journalDone').value,tomorrow:document.querySelector('#journalTomorrow').value,notes:document.querySelector('#journalNotes').value};save()}function tomorrowTasks(){let d=document.querySelector('#journalDate').value,raw=document.querySelector('#journalTomorrow').value.trim();if(!raw)return alert('Сначала запиши планы на завтра');let next=new Date(d+'T12:00:00');next.setDate(next.getDate()+1);let date=next.toLocaleDateString('en-CA');raw.split('\n').map(x=>x.trim()).filter(Boolean).forEach((text,n)=>data.tasks.unshift({id:Date.now()+n,text,date,project:data.project,done:false}));journalSave();alert('Планы добавлены в задачи на '+date)}function profileSave(){for(let key of ['bio','goals','highlights'])data.profile[key]=document.querySelector('#'+key).value;save()}function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='content-space-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.posts)||!Array.isArray(x.tasks)||!Array.isArray(x.ideas))throw Error();if(confirm('Заменить текущие данные резервной копией?')){data={...initial,...x};save()}}catch(err){alert('Не удалось прочитать копию')}};r.readAsText(f)}render();
</script></body></html>
